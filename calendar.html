<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Bee Edition</title>
  <meta name="description" content="A beautiful calendar for planning your tasks and events.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fbf4df;
      --cream-deep: #f3e3bd;
      --leaf: #6f8f56;
      --leaf-dark: #49643a;
      --honey: #f2aa22;
      --honey-light: #ffd86b;
      --brown: #7a5127;
      --ink: #2f3328;
      --muted: #7d806f;
      --white: rgba(255, 252, 241, 0.92);
      --shadow: 0 18px 45px rgba(88, 64, 31, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 232, 132, 0.38), transparent 24rem),
        linear-gradient(135deg, #f7edcf 0%, #f9f5e9 44%, #e9f0df 100%);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .calendar-container {
      min-height: 100vh;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      gap: 16px;
    }

    .calendar-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .calendar-title h1 {
      margin: 0;
      font-family: Lora, serif;
      font-size: 2rem;
      color: var(--leaf-dark);
    }

    .calendar-title .leaf-icon {
      font-size: 2rem;
    }

    .back-button {
      border: 0;
      border-radius: 999px;
      background: #e8eddd;
      color: var(--leaf-dark);
      padding: 9px 14px;
      font-weight: 700;
      transition: transform 0.15s ease, background 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-button:hover {
      transform: translateY(-2px);
      background: var(--leaf);
      color: white;
    }

    .view-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(111, 143, 86, 0.18);
      padding-bottom: 16px;
    }

    .view-tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 16px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.15s ease;
      font-size: 0.95rem;
    }

    .view-tab.active {
      color: var(--leaf);
      border-bottom-color: var(--leaf);
    }

    .view-tab:hover {
      color: var(--leaf-dark);
    }

    .calendar-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .nav-button {
      border: 0;
      border-radius: 999px;
      background: #e8eddd;
      color: var(--leaf-dark);
      padding: 9px 14px;
      font-weight: 700;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .nav-button:hover {
      transform: translateY(-2px);
      background: var(--leaf);
      color: white;
    }

    .current-date {
      color: var(--leaf-dark);
      font-weight: 700;
      font-size: 1rem;
      min-width: 120px;
      text-align: center;
    }

    .calendar-view {
      background: var(--white);
      border: 1px solid rgba(111, 143, 86, 0.18);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
      display: none;
    }

    .calendar-view.active {
      display: block;
    }

    /* Month View */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .month-day-header {
      text-align: center;
      font-weight: 700;
      color: var(--leaf-dark);
      padding: 8px;
      font-size: 0.9rem;
    }

    .month-day {
      min-height: 100px;
      border: 1px solid rgba(111, 143, 86, 0.12);
      border-radius: 12px;
      padding: 8px;
      background: rgba(255, 253, 245, 0.88);
      cursor: pointer;
      transition: background 0.15s ease;
      position: relative;
    }

    .month-day:hover {
      background: rgba(111, 143, 86, 0.08);
    }

    .month-day.other-month {
      opacity: 0.4;
    }

    .month-day.today {
      background: rgba(111, 143, 86, 0.1);
      border-color: var(--leaf);
    }

    .month-day-number {
      font-weight: 700;
      color: var(--leaf-dark);
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .month-day-events {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.7rem;
    }

    .event-chip {
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .event-chip:hover {
      opacity: 0.8;
    }

    /* Week/Day View */
    .time-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 12px;
      overflow-x: auto;
    }

    .time-slots {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .time-slot-header {
      height: 60px;
      display: flex;
      align-items: center;
      font-weight: 700;
      color: var(--leaf-dark);
      font-size: 0.85rem;
      padding: 0 8px;
    }

    .time-slot {
      height: 60px;
      border-top: 1px solid rgba(111, 143, 86, 0.12);
      padding: 4px;
      position: relative;
      cursor: pointer;
      background: rgba(255, 253, 245, 0.88);
    }

    .time-slot:hover {
      background: rgba(111, 143, 86, 0.06);
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
    }

    .week-column {
      border-left: 1px solid rgba(111, 143, 86, 0.12);
    }

    .week-column:first-child {
      border-left: none;
    }

    .week-day-header {
      padding: 12px 8px;
      text-align: center;
      font-weight: 700;
      color: var(--leaf-dark);
      border-bottom: 1px solid rgba(111, 143, 86, 0.18);
      background: rgba(111, 143, 86, 0.04);
    }

    .week-day-header.today {
      background: rgba(111, 143, 86, 0.12);
      color: var(--leaf);
    }

    .day-time-slot {
      height: 60px;
      border-top: 1px solid rgba(111, 143, 86, 0.12);
      padding: 4px;
      position: relative;
      cursor: pointer;
      background: rgba(255, 253, 245, 0.88);
    }

    .day-time-slot:hover {
      background: rgba(111, 143, 86, 0.06);
    }

    /* Event Modal */
    .event-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(47, 51, 40, 0.38);
      backdrop-filter: blur(7px);
      display: none;
    }

    .event-modal-overlay.active {
      display: grid;
    }

    .event-modal {
      width: min(540px, 100%);
      border-radius: 30px;
      background: #fff9e6;
      border: 1px solid rgba(111, 143, 86, 0.2);
      box-shadow: 0 28px 80px rgba(47, 51, 40, 0.24);
      padding: 28px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .event-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .event-modal-header h2 {
      margin: 0;
      font-family: Lora, serif;
      color: var(--leaf-dark);
      font-size: 1.5rem;
    }

    .event-modal-close {
      border: 0;
      background: #efe4c8;
      color: var(--brown);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-weight: 800;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .event-modal-close:hover {
      transform: scale(1.08);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-weight: 700;
      color: var(--leaf-dark);
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(111, 143, 86, 0.18);
      border-radius: 12px;
      background: #fffdf5;
      color: var(--ink);
      font-size: 0.95rem;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--leaf);
      background: white;
    }

    .color-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .color-swatch:hover {
      transform: scale(1.08);
    }

    .color-swatch.selected {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px white, 0 0 0 4px var(--ink);
    }

    .icon-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-option {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(111, 143, 86, 0.18);
      border-radius: 8px;
      background: #fffdf5;
      font-size: 1.5rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .icon-option:hover {
      transform: scale(1.08);
      border-color: var(--leaf);
    }

    .icon-option.selected {
      border-color: var(--leaf);
      background: rgba(111, 143, 86, 0.1);
    }

    .form-buttons {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }

    .form-button {
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .form-button.primary {
      background: var(--leaf);
      color: white;
    }

    .form-button.primary:hover {
      transform: translateY(-2px);
    }

    .form-button.secondary {
      background: #e8eddd;
      color: var(--leaf-dark);
    }

    .form-button.secondary:hover {
      transform: translateY(-2px);
      background: var(--leaf);
      color: white;
    }

    .form-button.delete {
      background: #e8a8a8;
      color: #5c2c2c;
      flex: 0 0 auto;
    }

    .form-button.delete:hover {
      transform: translateY(-2px);
    }

    .all-day-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .all-day-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--leaf);
      cursor: pointer;
    }

    .all-day-toggle label {
      cursor: pointer;
      font-weight: 700;
      color: var(--leaf-dark);
    }

    .time-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .time-inputs.hidden {
      display: none;
    }

    .duration-input {
      width: 100%;
    }

    @media (max-width: 768px) {
      .calendar-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .month-grid {
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }

      .month-day {
        min-height: 80px;
        font-size: 0.8rem;
      }

      .time-grid {
        grid-template-columns: 60px 1fr;
        gap: 8px;
      }

      .time-slot {
        height: 50px;
      }

      .day-time-slot {
        height: 50px;
      }

      .calendar-controls {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="calendar-container">
    <div class="calendar-header">
      <div class="calendar-title">
        <span class="leaf-icon">🌿</span>
        <h1>Calendar</h1>
      </div>
      <a href="index.html" class="back-button">← Back to tasks</a>
    </div>

    <div class="view-tabs">
      <button class="view-tab active" data-view="day">Day</button>
      <button class="view-tab" data-view="week">Week</button>
      <button class="view-tab" data-view="month">Month</button>
    </div>

    <div class="calendar-controls">
      <button class="nav-button" id="prev-btn">← Previous</button>
      <div class="current-date" id="current-date"></div>
      <button class="nav-button" id="next-btn">Next →</button>
      <button class="nav-button" id="today-btn">Today</button>
    </div>

    <!-- Month View -->
    <div class="calendar-view active" id="month-view">
      <div class="month-grid" id="month-grid"></div>
    </div>

    <!-- Week View -->
    <div class="calendar-view" id="week-view">
      <div class="time-grid">
        <div class="time-slots" id="week-time-labels"></div>
        <div class="week-grid" id="week-grid"></div>
      </div>
    </div>

    <!-- Day View -->
    <div class="calendar-view" id="day-view">
      <div class="time-grid">
        <div class="time-slots" id="day-time-labels"></div>
        <div id="day-grid"></div>
      </div>
    </div>
  </div>

  <!-- Event Modal -->
  <div class="event-modal-overlay" id="event-modal-overlay">
    <div class="event-modal">
      <div class="event-modal-header">
        <h2 id="event-modal-title">New Event</h2>
        <button class="event-modal-close" id="event-modal-close">✕</button>
      </div>

      <form id="event-form">
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" id="event-title" class="form-input" placeholder="Event name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" id="event-date" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="all-day-toggle">
            <input type="checkbox" id="event-all-day">
            <label for="event-all-day">All day</label>
          </label>
        </div>

        <div class="time-inputs" id="time-inputs">
          <div class="form-group">
            <label class="form-label">Start time</label>
            <input type="time" id="event-start-time" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Duration (min)</label>
            <input type="number" id="event-duration" class="form-input duration-input" min="15" max="480" value="60">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Color</label>
          <div class="color-picker" id="color-picker"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Icon</label>
          <div class="icon-picker" id="icon-picker"></div>
        </div>

        <div class="form-buttons">
          <button type="button" class="form-button secondary" id="event-cancel-btn">Cancel</button>
          <button type="button" class="form-button delete" id="event-delete-btn" style="display: none;">Delete</button>
          <button type="submit" class="form-button primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const CALENDAR_STORAGE_KEY = 'beeCalendarEvents';
    const TASKS_STORAGE_KEY = 'beeTaskbar.tasks';

    const colors = [
      '#FF6B6B', // Red
      '#FF9F43', // Orange
      '#FFC107', // Yellow
      '#2ED573', // Green
      '#5F27CD', // Purple
      '#00D2D3'  // Cyan
    ];

    const icons = ['🐝', '🌿', '📚', '💼', '🍵', '🎨', '⭐', '🏃'];

    let currentDate = new Date();
    let currentView = 'month';
    let events = [];
    let editingEventId = null;

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => Array.from(document.querySelectorAll(selector));

    function loadEvents() {
      const saved = localStorage.getItem(CALENDAR_STORAGE_KEY);
      events = saved ? JSON.parse(saved) : [];
    }

    function saveEvents() {
      localStorage.setItem(CALENDAR_STORAGE_KEY, JSON.stringify(events));
    }

    function loadTasksAsEvents() {
      const tasksStr = localStorage.getItem(TASKS_STORAGE_KEY);
      if (!tasksStr) return;
      
      try {
        const tasks = JSON.parse(tasksStr);
        const today = new Date().toISOString().split('T')[0];
        
        tasks.forEach(task => {
          if (!events.find(e => e.id === task.id && e.isTask)) {
            events.push({
              id: task.id,
              title: task.text,
              date: today,
              startTime: null,
              duration: null,
              allDay: true,
              color: '#6f8f56',
              icon: '🐝',
              isTask: true,
              done: task.done
            });
          }
        });
      } catch (e) {
        console.error('Error loading tasks', e);
      }
    }

    function formatDate(date) {
      const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }

    function formatDateISO(date) {
      return date.toISOString().split('T')[0];
    }

    function parseDate(dateStr) {
      return new Date(dateStr + 'T00:00:00');
    }

    function getDaysInMonth(date) {
      return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    }

    function getFirstDayOfMonth(date) {
      return new Date(date.getFullYear(), date.getMonth(), 1).getDay();
    }

    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function renderMonthView() {
      const month = currentDate.getMonth();
      const year = currentDate.getFullYear();
      const daysInMonth = getDaysInMonth(currentDate);
      const firstDay = getFirstDayOfMonth(currentDate);
      const grid = $('#month-grid');
      
      grid.innerHTML = '';

      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      dayNames.forEach(name => {
        const header = document.createElement('div');
        header.className = 'month-day-header';
        header.textContent = name;
        grid.appendChild(header);
      });

      const prevMonthDays = getDaysInMonth(new Date(year, month - 1));
      for (let i = firstDay - 1; i >= 0; i--) {
        const day = document.createElement('div');
        day.className = 'month-day other-month';
        day.textContent = prevMonthDays - i;
        grid.appendChild(day);
      }

      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const dayEl = document.createElement('div');
        const date = new Date(year, month, day);
        const dateStr = formatDateISO(date);
        const dayEvents = events.filter(e => e.date === dateStr);

        dayEl.className = 'month-day';
        if (date.toDateString() === today.toDateString()) {
          dayEl.classList.add('today');
        }
        if (month !== currentDate.getMonth()) {
          dayEl.classList.add('other-month');
        }

        dayEl.innerHTML = `<div class="month-day-number">${day}</div><div class="month-day-events"></div>`;
        const eventsContainer = dayEl.querySelector('.month-day-events');

        dayEvents.slice(0, 2).forEach(event => {
          const chip = document.createElement('div');
          chip.className = 'event-chip';
          chip.style.backgroundColor = event.color;
          chip.style.color = '#fff';
          chip.textContent = `${event.icon} ${event.title}`;
          chip.onclick = (e) => {
            e.stopPropagation();
            openEventModal(event.id);
          };
          eventsContainer.appendChild(chip);
        });

        if (dayEvents.length > 2) {
          const more = document.createElement('div');
          more.className = 'event-chip';
          more.textContent = `+${dayEvents.length - 2} more`;
          more.style.fontSize = '0.65rem';
          eventsContainer.appendChild(more);
        }

        dayEl.onclick = () => createEventForDate(dateStr);
        grid.appendChild(dayEl);
      }

      const nextMonthDays = 42 - (firstDay + daysInMonth);
      for (let day = 1; day <= nextMonthDays; day++) {
        const dayEl = document.createElement('div');
        dayEl.className = 'month-day other-month';
        dayEl.textContent = day;
        grid.appendChild(dayEl);
      }

      $('#current-date').textContent = new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function renderWeekView() {
      const weekStart = getWeekStart(currentDate);
      const weekLabels = $('#week-time-labels');
      const weekGrid = $('#week-grid');
      
      weekLabels.innerHTML = '';
      weekGrid.innerHTML = '';

      for (let h = 7; h <= 23; h++) {
        const label = document.createElement('div');
        label.className = 'time-slot-header';
        const ampm = h < 12 ? 'AM' : 'PM';
        const displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
        label.textContent = `${displayH}:00 ${ampm}`;
        weekLabels.appendChild(label);
      }

      for (let day = 0; day < 7; day++) {
        const col = document.createElement('div');
        const date = new Date(weekStart);
        date.setDate(date.getDate() + day);
        const dateStr = formatDateISO(date);
        const isToday = date.toDateString() === new Date().toDateString();

        const header = document.createElement('div');
        header.className = `week-day-header${isToday ? ' today' : ''}`;
        const dayName = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
        header.textContent = `${dayName} ${date.getDate()}`;
        weekGrid.appendChild(header);

        for (let h = 7; h <= 23; h++) {
          const slot = document.createElement('div');
          slot.className = 'day-time-slot';
          const timeStr = `${h.toString().padStart(2, '0')}:00`;
          const dayEvents = events.filter(e => e.date === dateStr && !e.allDay);
          
          const eventInSlot = dayEvents.find(e => {
            if (!e.startTime) return false;
            const [eventH] = e.startTime.split(':');
            return parseInt(eventH) === h;
          });

          if (eventInSlot) {
            slot.innerHTML = `<div style="font-size: 0.75rem; color: #fff; background: ${eventInSlot.color}; padding: 2px 4px; border-radius: 4px; cursor: pointer;">${eventInSlot.icon} ${eventInSlot.title}</div>`;
            slot.onclick = (e) => {
              e.stopPropagation();
              openEventModal(eventInSlot.id);
            };
          } else {
            slot.onclick = () => createEventForDateTime(dateStr, timeStr);
          }

          weekGrid.appendChild(slot);
        }
      }

      $('#current-date').textContent = `${formatDate(weekStart)} - ${formatDate(new Date(weekStart.getTime() + 6 * 24 * 60 * 60 * 1000))}`;
    }

    function renderDayView() {
      const dateStr = formatDateISO(currentDate);
      const dayLabels = $('#day-time-labels');
      const dayGrid = $('#day-grid');
      
      dayLabels.innerHTML = '';
      dayGrid.innerHTML = '';

      for (let h = 7; h <= 23; h++) {
        const label = document.createElement('div');
        label.className = 'time-slot-header';
        const ampm = h < 12 ? 'AM' : 'PM';
        const displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
        label.textContent = `${displayH}:00 ${ampm}`;
        dayLabels.appendChild(label);
      }

      for (let h = 7; h <= 23; h++) {
        const slot = document.createElement('div');
        slot.className = 'time-slot';
        const timeStr = `${h.toString().padStart(2, '0')}:00`;
        const dayEvents = events.filter(e => e.date === dateStr && !e.allDay);
        
        const eventInSlot = dayEvents.find(e => {
          if (!e.startTime) return false;
          const [eventH] = e.startTime.split(':');
          return parseInt(eventH) === h;
        });

        if (eventInSlot) {
          slot.innerHTML = `<div style="font-size: 0.8rem; color: #fff; background: ${eventInSlot.color}; padding: 4px 6px; border-radius: 6px; cursor: pointer;">${eventInSlot.icon} ${eventInSlot.title}</div>`;
          slot.onclick = (e) => {
            e.stopPropagation();
            openEventModal(eventInSlot.id);
          };
        } else {
          slot.onclick = () => createEventForDateTime(dateStr, timeStr);
        }

        dayGrid.appendChild(slot);
      }

      $('#current-date').textContent = formatDate(currentDate);
    }

    function render() {
      $$('.calendar-view').forEach(v => v.classList.remove('active'));
      if (currentView === 'month') {
        $('#month-view').classList.add('active');
        renderMonthView();
      } else if (currentView === 'week') {
        $('#week-view').classList.add('active');
        renderWeekView();
      } else if (currentView === 'day') {
        $('#day-view').classList.add('active');
        renderDayView();
      }
    }

    function createEventForDate(dateStr) {
      editingEventId = null;
      $('#event-modal-title').textContent = 'New Event';
      $('#event-title').value = '';
      $('#event-date').value = dateStr;
      $('#event-start-time').value = '09:00';
      $('#event-duration').value = '60';
      $('#event-all-day').checked = true;
      $('#time-inputs').classList.add('hidden');
      $('#event-delete-btn').style.display = 'none';
      $$('.color-swatch').forEach((s, i) => s.classList.toggle('selected', i === 0));
      $$('.icon-option').forEach((s, i) => s.classList.toggle('selected', i === 0));
      $('#event-modal-overlay').classList.add('active');
    }

    function createEventForDateTime(dateStr, timeStr) {
      editingEventId = null;
      $('#event-modal-title').textContent = 'New Event';
      $('#event-title').value = '';
      $('#event-date').value = dateStr;
      $('#event-start-time').value = timeStr;
      $('#event-duration').value = '60';
      $('#event-all-day').checked = false;
      $('#time-inputs').classList.remove('hidden');
      $('#event-delete-btn').style.display = 'none';
      $$('.color-swatch').forEach((s, i) => s.classList.toggle('selected', i === 0));
      $$('.icon-option').forEach((s, i) => s.classList.toggle('selected', i === 0));
      $('#event-modal-overlay').classList.add('active');
    }

    function openEventModal(eventId) {
      editingEventId = eventId;
      const event = events.find(e => e.id === eventId);
      if (!event) return;

      $('#event-modal-title').textContent = 'Edit Event';
      $('#event-title').value = event.title;
      $('#event-date').value = event.date;
      $('#event-start-time').value = event.startTime || '09:00';
      $('#event-duration').value = event.duration || '60';
      $('#event-all-day').checked = event.allDay;
      
      if (event.allDay) {
        $('#time-inputs').classList.add('hidden');
      } else {
        $('#time-inputs').classList.remove('hidden');
      }

      $$('.color-swatch').forEach(s => s.classList.remove('selected'));
      $$('.color-swatch').forEach((s, i) => {
        if (s.style.backgroundColor === event.color) {
          s.classList.add('selected');
        }
      });

      $$('.icon-option').forEach(s => s.classList.remove('selected'));
      $$('.icon-option').forEach((s, i) => {
        if (s.textContent === event.icon) {
          s.classList.add('selected');
        }
      });

      $('#event-delete-btn').style.display = event.isTask ? 'none' : 'block';
      $('#event-modal-overlay').classList.add('active');
    }

    function closeEventModal() {
      $('#event-modal-overlay').classList.remove('active');
      editingEventId = null;
    }

    function saveEvent(formData) {
      const title = $('#event-title').value.trim();
      const date = $('#event-date').value;
      const allDay = $('#event-all-day').checked;
      const startTime = allDay ? null : $('#event-start-time').value;
      const duration = allDay ? null : parseInt($('#event-duration').value);
      
      const selectedColor = $$('.color-swatch.selected')[0];
      const color = selectedColor ? selectedColor.style.backgroundColor : colors[0];
      
      const selectedIcon = $$('.icon-option.selected')[0];
      const icon = selectedIcon ? selectedIcon.textContent : icons[0];

      if (!title) {
        alert('Please enter a title');
        return;
      }

      if (editingEventId) {
        const eventIndex = events.findIndex(e => e.id === editingEventId);
        if (eventIndex >= 0) {
          events[eventIndex] = {
            ...events[eventIndex],
            title,
            date,
            startTime,
            duration,
            allDay,
            color,
            icon
          };
        }
      } else {
        events.push({
          id: crypto.randomUUID(),
          title,
          date,
          startTime,
          duration,
          allDay,
          color,
          icon,
          isTask: false
        });
      }

      saveEvents();
      closeEventModal();
      render();
    }

    function deleteEvent() {
      if (editingEventId) {
        events = events.filter(e => e.id !== editingEventId);
        saveEvents();
        closeEventModal();
        render();
      }
    }

    function initColorPicker() {
      const picker = $('#color-picker');
      picker.innerHTML = '';
      colors.forEach((color, i) => {
        const swatch = document.createElement('div');
        swatch.className = `color-swatch${i === 0 ? ' selected' : ''}`;
        swatch.style.backgroundColor = color;
        swatch.onclick = () => {
          $$('.color-swatch').forEach(s => s.classList.remove('selected'));
          swatch.classList.add('selected');
        };
        picker.appendChild(swatch);
      });
    }

    function initIconPicker() {
      const picker = $('#icon-picker');
      picker.innerHTML = '';
      icons.forEach((icon, i) => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = `icon-option${i === 0 ? ' selected' : ''}`;
        option.textContent = icon;
        option.onclick = (e) => {
          e.preventDefault();
          $$('.icon-option').forEach(s => s.classList.remove('selected'));
          option.classList.add('selected');
        };
        picker.appendChild(option);
      });
    }

    function init() {
      loadEvents();
      loadTasksAsEvents();
      render();

      $$('.view-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          $$('.view-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentView = tab.dataset.view;
          render();
        });
      });

      $('#prev-btn').addEventListener('click', () => {
        if (currentView === 'month') {
          currentDate.setMonth(currentDate.getMonth() - 1);
        } else if (currentView === 'week') {
          currentDate.setDate(currentDate.getDate() - 7);
        } else {
          currentDate.setDate(currentDate.getDate() - 1);
        }
        render();
      });

      $('#next-btn').addEventListener('click', () => {
        if (currentView === 'month') {
          currentDate.setMonth(currentDate.getMonth() + 1);
        } else if (currentView === 'week') {
          currentDate.setDate(currentDate.getDate() + 7);
        } else {
          currentDate.setDate(currentDate.getDate() + 1);
        }
        render();
      });

      $('#today-btn').addEventListener('click', () => {
        currentDate = new Date();
        render();
      });

      $('#event-all-day').addEventListener('change', () => {
        if ($('#event-all-day').checked) {
          $('#time-inputs').classList.add('hidden');
        } else {
          $('#time-inputs').classList.remove('hidden');
        }
      });

      $('#event-form').addEventListener('submit', (e) => {
        e.preventDefault();
        saveEvent();
      });

      $('#event-modal-close').addEventListener('click', closeEventModal);
      $('#event-cancel-btn').addEventListener('click', closeEventModal);
      $('#event-delete-btn').addEventListener('click', deleteEvent);

      $('#event-modal-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'event-modal-overlay') closeEventModal();
      });

      initColorPicker();
      initIconPicker();
    }

    init();
  </script>
</body>
</html>
